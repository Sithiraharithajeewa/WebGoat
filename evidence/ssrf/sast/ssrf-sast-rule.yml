rules:
  - id: java-ssrf-url-openstream
    languages:
      - java
    message: "Potential SSRF: untrusted URL is opened directly with URL.openStream()"
    severity: ERROR
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery (SSRF)"
      category: security
      confidence: HIGH
    patterns:
      - pattern: |
          new URL($URL).openStream()
